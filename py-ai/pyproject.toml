[project]
name = "ulysses-ai"
version = "0.1.0"
description = "Ulysses AI — Python LLM bridge for the Ulysses agent runtime"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
ulysses-ai = "ulysses_ai.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ulysses_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
